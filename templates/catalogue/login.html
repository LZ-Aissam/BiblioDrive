{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-xl shadow p-8">

        <h1 class="text-2xl font-bold text-brand-dark mb-6 text-center">Connexion</h1>

        <!-- message d'erreur si mauvais identifiants -->
        {% if form.errors %}
        <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
            Identifiant ou mot de passe incorrect. Veuillez reessayer.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="mb-4">
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">
                    Identifiant
                </label>
                <input type="text" name="username" id="id_username"
                       autofocus autocomplete="username" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light">
            </div>

            <div class="mb-6">
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">
                    Mot de passe
                </label>
                <input type="password" name="password" id="id_password"
                       autocomplete="current-password" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-brand-light">
            </div>

            <button type="submit"
                    class="w-full bg-brand-dark text-white py-2 rounded-lg hover:bg-brand-light transition-colors font-medium">
                Se connecter
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-gray-500">
            Pas de compte ?
            <a href="{% url 'catalogue:register' %}" class="text-brand-dark hover:underline font-medium">S'inscrire</a>
        </p>

    </div>
</div>

{% endblock %}
