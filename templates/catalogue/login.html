{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}

<div class="max-w-sm mx-auto mt-10">
    <div class="bg-white rounded shadow p-6">
        <h1 class="text-xl font-bold text-gray-800 mb-4">Connexion</h1>

        {% if form.errors %}
        <p class="text-red-500 text-sm mb-3">Identifiant ou mot de passe incorrect.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

            <div class="mb-3">
                <label class="block text-sm text-gray-600 mb-1">Identifiant</label>
                <input type="text" name="username" autofocus required
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">Mot de passe</label>
                <input type="password" name="password" required
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
            </div>
            <button type="submit" class="w-full bg-brand-dark text-white py-2 rounded text-sm hover:bg-brand-light">
                Se connecter
            </button>
        </form>

        <p class="text-sm text-gray-500 mt-3 text-center">
            Pas de compte ? <a href="{% url 'catalogue:register' %}" class="text-brand-dark hover:underline">S'inscrire</a>
        </p>
    </div>
</div>

{% endblock %}
