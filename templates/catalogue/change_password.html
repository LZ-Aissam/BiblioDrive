{% extends "base.html" %}

{% block title %}Changer mot de passe{% endblock %}

{% block content %}

<div class="max-w-sm mx-auto mt-10">
    <div class="bg-white rounded shadow p-6">
        <h1 class="text-xl font-bold text-gray-800 mb-4">Changer le mot de passe</h1>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="block text-sm text-gray-600 mb-1">{{ field.label }}</label>
                <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                       class="w-full border {% if field.errors %}border-red-400{% else %}border-gray-300{% endif %} rounded px-3 py-2 text-sm">
                {% if field.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="w-full bg-brand-dark text-white py-2 rounded text-sm hover:bg-brand-light">
                Valider
            </button>
        </form>

        <p class="mt-3 text-center">
            <a href="{% url 'catalogue:home' %}" class="text-sm text-gray-500 hover:underline">Annuler</a>
        </p>
    </div>
</div>

{% endblock %}
